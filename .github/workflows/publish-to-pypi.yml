name: Publish PyPI
on: push

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.10"

    - name: Install
      run: python3 -m pip install -e ".[test]"

    - name: Run tests
      run: python3 -m pytest

  build:
    name: Build
    needs: tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Install and build
      run: python3 -m pip install build --user

    - name: Build a binary wheel
      run: python3 -m build

    - name: Store the distribution packages
      uses: actions/upload-artifact@v5
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/') # only publish to PyPI on tag pushes
    needs:
      - build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/ydpy

    permissions:
      id-token: write  # mandatory for trusted publishing

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-to-testpypi:
    name: Publish dev build to TestPyPI
    needs:
      - tests
    runs-on: ubuntu-latest

    environment:
      name: testpypi
      url: https://test.pypi.org/p/ydpy

    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.x"

    - name: Stamp a unique dev version
      # TestPyPI never releases a file name; per-push uploads need a unique
      # version, so the release version is only ever tested on tag pushes.
      run: |
        sed -i 's/^version = .*/version = "0.1.0.dev'${{ github.run_number }}'"/' pyproject.toml
        grep -n '^version' pyproject.toml

    - name: Install and build
      run: python3 -m pip install build --user

    - name: Build the dev distribution
      run: python3 -m build

    - name: Publish distribution to TestPyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        repository-url: https://test.pypi.org/legacy/
